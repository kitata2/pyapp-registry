[project]
name = "app-registry"
version = "0.1.0"
description = "Web UI to inventory and manage Python apps on a Linux VPS with systemd + Tailscale"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "psutil",
]

# No package layout / build system — this is a simple script project.
# Run with: uv run streamlit run app_registry.py --server.port 8500
